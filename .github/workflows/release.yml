# =============================================================
# 三平台自动构建发布流程（Windows / macOS / Ubuntu）
# 推送 v 开头的 tag（如 v0.1.0）时触发：
#   1. 三平台并行构建 Tauri 安装包（.msi/.exe、.dmg/.app、.deb/.AppImage）
#   2. 自动创建 GitHub Release 并上传各平台产物
#   3. Ubuntu 额外打包源码 tar.gz 追加到同一 Release
# =============================================================
name: Release

on:
  push:
    tags:
      - "v*"

# 创建/上传 Release 需要 contents 写权限
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          # macOS 通用二进制：同时包含 Intel(x86_64) 与 Apple Silicon(aarch64)，
          # 一个 DMG 通吃两种芯片（macos-14 镜像已下线，用 macos-latest）
          - platform: macos-latest
            args: --target universal-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: 12

      # setup-node 的 cache: pnpm 需要先装好 pnpm，故 action-setup 在前
      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust stable 工具链
        uses: dtolnay/rust-toolchain@stable

      # macOS 通用包：arm64 运行器需要额外装 x86_64 target（aarch64 是默认）
      - name: 添加 macOS 双架构 target
        if: startsWith(matrix.platform, 'macos')
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Rust 端在 src-tauri/，仓库根没有 Cargo.toml，需显式指定 workspace
      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.args }}

      - name: 安装 Ubuntu 系统依赖（Tauri 2 需要 webkit2gtk-4.1）
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2

      # 仓库根存在 pnpm-lock.yaml，用 frozen-lockfile 保证 CI 与本地依赖一致
      - name: 安装前端依赖
        run: pnpm install --no-frozen-lockfile

      # tauri 项目根即仓库根：tauri-action 读取 src-tauri/tauri.conf.json，
      # 并执行其 beforeBuildCommand（pnpm build）完成前端构建。
      # APPLE_SIGNING_IDENTITY="-" = ad-hoc 签名：无开发者证书时也能避免
      # “文件已损坏”提示（用户首次打开仍需右键 → 打开，或执行 xattr -cr）。
      - name: 构建 Tauri 并创建 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NEXUS Workbench ${{ github.ref_name }}"
          releaseBody: "安装包：Windows（.msi/.exe）、macOS 通用包（universal.dmg 或 macos-universal.zip，含一键安装脚本）、Ubuntu（.deb/.AppImage）。源码包见下方 Source code。更新说明见 CHANGELOG.md。"
          releaseDraft: false
          prerelease: false
          projectPath: "."
          args: ${{ matrix.args }}

      # 仅 Ubuntu：把 CHANGELOG.md 对应版本段落写成 Release 正文，并打源码包
      - name: 生成更新日志正文
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          {
            echo "# NEXUS Workbench ${{ github.ref_name }}"
            echo ""
            cat CHANGELOG.md
          } > release-body.md
          git archive --format=tar.gz -o source-${{ github.ref_name }}.tar.gz HEAD

      # 仅 macOS：额外产出 .app.zip + 一键安装脚本（自动解除 quarantine）
      # 未做 Apple 公证的应用从浏览器下载后会被 Gatekeeper 报「文件已损坏」，
      # .app.zip 里的 install-macos.command 会自动 xattr -cr 并安装到 /Applications
      - name: 打包 macOS .app.zip 与一键安装脚本
        if: startsWith(matrix.platform, 'macos')
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/nexus-workbench.app"
          echo "== 校验签名 =="
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "== 校验架构 =="
          lipo -archs "$APP/Contents/MacOS/nexus-workbench"
          VER="${GITHUB_REF_NAME#v}"
          STAGE="macos-pkg/nexus-workbench"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          cat > "$STAGE/install-macos.command" <<'SH'
          #!/bin/bash
          set -e
          DIR="$(cd "$(dirname "$0")" && pwd)"
          APP="$DIR/nexus-workbench.app"
          echo "→ 解除隔离标记（避免“文件已损坏”提示）..."
          xattr -cr "$APP"
          echo "→ 安装到 /Applications ..."
          rm -rf "/Applications/nexus-workbench.app"
          cp -R "$APP" "/Applications/nexus-workbench.app"
          xattr -cr "/Applications/nexus-workbench.app"
          echo "→ 启动 NEXUS Workbench ..."
          open "/Applications/nexus-workbench.app"
          echo "完成。"
          SH
          chmod +x "$STAGE/install-macos.command"
          ditto -c -k --keepParent "$STAGE" "nexus-workbench_${VER}_macos-universal.zip"

      - name: 上传 macOS zip 到 Release
        if: startsWith(matrix.platform, 'macos')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          files: nexus-workbench_*_macos-universal.zip

      # tauri-action 已按 tag 创建 Release；softprops 检测到同名 Release 时
      # 追加 assets 并用 body_path 覆盖正文为完整更新日志
      - name: 追加源码包并写入更新日志
        if: matrix.platform == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-body.md
          files: source-*.tar.gz
