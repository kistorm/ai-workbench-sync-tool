# =============================================================
# 三平台自动构建发布流程（Windows / macOS / Ubuntu）
# 推送 v 开头的 tag（如 v0.1.0）时触发：
#   1. 三平台并行构建 Tauri 安装包（.msi/.exe、.dmg/.app、.deb/.AppImage）
#   2. 自动创建 GitHub Release 并上传各平台产物
#   3. Ubuntu 额外打包源码 tar.gz 追加到同一 Release
# =============================================================
name: Release

on:
  push:
    tags:
      - "v*"

# 创建/上传 Release 需要 contents 写权限
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: ""
            args: ""
          - platform: windows-latest
            target: ""
            args: ""
          # Apple Silicon（M 系列）
          - platform: macos-14
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          # Intel 芯片（macos-14 是 arm64 运行器，交叉编译出 x86_64 包）
          - platform: macos-14
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm 10
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # setup-node 的 cache: pnpm 需要先装好 pnpm，故 action-setup 在前
      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装 Rust stable 工具链
        uses: dtolnay/rust-toolchain@stable

      # macOS 交叉编译：arm64 运行器上额外装 x86_64 target
      - name: 添加交叉编译 target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      # Rust 端在 src-tauri/，仓库根没有 Cargo.toml，需显式指定 workspace
      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: 安装 Ubuntu 系统依赖（Tauri 2 需要 webkit2gtk-4.1）
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2

      # 仓库根存在 pnpm-lock.yaml，用 frozen-lockfile 保证 CI 与本地依赖一致
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # tauri 项目根即仓库根：tauri-action 读取 src-tauri/tauri.conf.json，
      # 并执行其 beforeBuildCommand（pnpm build）完成前端构建。
      # APPLE_SIGNING_IDENTITY="-" = ad-hoc 签名：无开发者证书时也能避免
      # “文件已损坏”提示（用户首次打开仍需右键 → 打开，或执行 xattr -cr）。
      - name: 构建 Tauri 并创建 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NEXUS Workbench ${{ github.ref_name }}"
          releaseBody: "安装包：Windows（.msi/.exe）、macOS（Intel：x64.dmg / Apple Silicon：aarch64.dmg）、Ubuntu（.deb/.AppImage）。源码包见下方 Source code。更新说明见 CHANGELOG.md。"
          releaseDraft: false
          prerelease: false
          projectPath: "."
          args: ${{ matrix.args }}

      # 仅 Ubuntu：把 CHANGELOG.md 对应版本段落写成 Release 正文，并打源码包
      - name: 生成更新日志正文
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          {
            echo "# NEXUS Workbench ${{ github.ref_name }}"
            echo ""
            cat CHANGELOG.md
          } > release-body.md
          git archive --format=tar.gz -o source-${{ github.ref_name }}.tar.gz HEAD

      # tauri-action 已按 tag 创建 Release；softprops 检测到同名 Release 时
      # 追加 assets 并用 body_path 覆盖正文为完整更新日志
      - name: 追加源码包并写入更新日志
        if: matrix.platform == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          body_path: release-body.md
          files: source-*.tar.gz
